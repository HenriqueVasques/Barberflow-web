<section class="min-h-screen bg-[#0b0b0b] text-white flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Efeito de Fundo Glow -->
  <div class="absolute w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none -top-20 -left-20"></div>

  <div class="w-full max-w-md bg-zinc-900/90 border border-zinc-800 rounded-2xl p-8 shadow-2xl backdrop-blur-md relative z-10">
    
    <!-- Logo e Título -->
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2 mb-4">
        <div class="w-10 h-10 rounded-full border border-amber-500 text-amber-500 flex items-center justify-center font-black text-sm">
          BF
        </div>
        <span class="text-xl font-extrabold tracking-wider uppercase text-white">BarberFlow</span>
      </a>
      <h2 class="text-2xl font-black uppercase text-white">Bem-vindo de volta</h2>
      <p class="text-zinc-400 text-xs mt-1">Acesse sua conta para agendar e gerenciar horários</p>
    </div>

    <!-- Mensagem de Erro -->
    @if (errorMessage) {
      <div class="bg-red-500/10 border border-red-500/50 text-red-400 text-xs p-3 rounded-lg mb-6 text-center">
        {{ errorMessage }}
      </div>
    }

    <!-- Botão Entrar com o Google -->
    <button 
      (click)="onGoogleLogin()" 
      [disabled]="isLoading"
      type="button"
      class="w-full flex items-center justify-center gap-3 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold text-xs py-3.5 px-4 rounded-xl border border-zinc-700 transition duration-300 shadow-md hover:border-zinc-500">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continuar com o Google</span>
    </button>

    <!-- Divisor "OU" -->
    <div class="relative my-6 flex items-center justify-center">
      <div class="border-t border-zinc-800 w-full"></div>
      <span class="bg-zinc-900 px-3 text-[10px] font-bold uppercase text-zinc-500 absolute">OU</span>
    </div>

    <!-- Formulário Manual -->
    <form (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">E-mail</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="seu@email.com"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 transition" 
          required
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400">Senha</label>
          <a href="#" class="text-[10px] text-amber-500 hover:underline">Esqueceu?</a>
        </div>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="••••••••"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500 transition" 
          required
        />
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold uppercase text-xs py-3.5 rounded-xl transition shadow-lg shadow-amber-500/10 mt-2">
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <!-- Link para Cadastro -->
    <p class="text-center text-xs text-zinc-500 mt-6">
      Ainda não tem conta? 
      <a routerLink="/register" class="text-amber-500 font-bold hover:underline">Criar conta</a>
    </p>

  </div>
</section>
